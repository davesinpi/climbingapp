
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send It - Climbing Workout Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // Custom colors can be added here
            }
          }
        }
      }
      
      // Shim for process.env and global for standard browser environment
      // Evaluation happens before modules start loading
      window.process = { 
        env: {
          API_KEY: "AIzaSyDUM35eKEZ-hR8CUjWT_e_LttNL5RwV2TU"
        } 
      };
      window.global = window;
      globalThis.process = window.process;

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #555; }
      .dark ::-webkit-scrollbar-track { background: #1e293b; }
      .dark ::-webkit-scrollbar-thumb { background: #475569; }
      #root { min-height: 100%; }
      
      /* Simple error overlay */
      #error-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.9);
        color: #ff4444;
        padding: 40px;
        z-index: 9999;
        font-family: monospace;
        overflow: auto;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "recharts": "https://esm.sh/recharts@2.15.0?external=react,react-dom",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 h-full">
    <div id="error-overlay">
      <h1 style="font-size: 24px; font-weight: bold; margin-bottom: 20px;">Runtime Error</h1>
      <pre id="error-message" style="white-space: pre-wrap;"></pre>
    </div>
    <div id="root"></div>

    <script>
      // Global error handler to capture boot errors
      window.onerror = function(msg, url, line, col, error) {
        const overlay = document.getElementById('error-overlay');
        const msgEl = document.getElementById('error-message');
        if (overlay && msgEl) {
          overlay.style.display = 'block';
          msgEl.textContent = error ? error.stack : msg + '\n' + url + ':' + line + ':' + col;
        }
        return false;
      };
      
      // Handle unhandled promise rejections (often from async imports)
      window.onunhandledrejection = function(event) {
        const overlay = document.getElementById('error-overlay');
        const msgEl = document.getElementById('error-message');
        if (overlay && msgEl) {
          overlay.style.display = 'block';
          msgEl.textContent = 'Unhandled Rejection: ' + (event.reason ? (event.reason.stack || event.reason) : 'Unknown reason');
        }
      };
    </script>
    
    <script type="module" src="index.tsx"></script>
</body>
</html>
