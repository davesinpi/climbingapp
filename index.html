
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Road to V10 - Climbing Workout Planner</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // Custom colors
            }
          }
        }
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; -webkit-tap-highlight-color: transparent; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      .dark ::-webkit-scrollbar-thumb { background: #334155; }
      #root { min-height: 100%; }
      
      #error-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.9);
        color: #ff4444;
        padding: 40px;
        z-index: 9999;
        font-family: monospace;
        overflow: auto;
      }

      @keyframes slideUp {
        from { transform: translateY(10px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "recharts": "https://esm.sh/recharts@2.15.0?external=react,react-dom",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 h-full">
    <div id="error-overlay">
      <h1 style="font-size: 24px; font-weight: bold; margin-bottom: 20px;">Runtime Error</h1>
      <pre id="error-message" style="white-space: pre-wrap;"></pre>
      <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #444; color: white; border: none; border-radius: 5px; cursor: pointer;">Reload Page</button>
    </div>
    <div id="root"></div>

    <script>
      window.onerror = function(msg, url, line, col, error) {
        const overlay = document.getElementById('error-overlay');
        const msgEl = document.getElementById('error-message');
        if (overlay && msgEl) {
          overlay.style.display = 'block';
          msgEl.textContent = error ? error.stack : msg + '\n' + url + ':' + line + ':' + col;
        }
        return false;
      };
      
      window.onunhandledrejection = function(event) {
        const overlay = document.getElementById('error-overlay');
        const msgEl = document.getElementById('error-message');
        if (overlay && msgEl) {
          overlay.style.display = 'block';
          msgEl.textContent = 'Unhandled Rejection: ' + (event.reason ? (event.reason.stack || event.reason) : 'Unknown reason');
        }
      };

      // Improved Service Worker registration for sandbox/blob safety
      if ('serviceWorker' in navigator && !window.location.href.startsWith('blob:')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('SW Registered'))
            .catch(err => {
              console.warn('ServiceWorker registration failed: ', err);
            });
        });
      } else {
        console.info('ServiceWorker skipped: running in blob/sandbox environment.');
      }
    </script>
    
    <script type="module" src="index.tsx"></script>
</body>
</html>
